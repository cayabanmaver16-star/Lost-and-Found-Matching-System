    description: "Sign in, identity, sign out"
  - name: Reports
    description: "Lost and found reports"
  - name: Matches
    description: "Candidate matches, verification and release"
  - name: Notifications
    description: "Match notifications"
  - name: "Manual queue"
    description: "Items that need a human: failed notifications, disposal reviews"
  - name: Operations
    description: "Health, metrics, logs, scheduled jobs"
