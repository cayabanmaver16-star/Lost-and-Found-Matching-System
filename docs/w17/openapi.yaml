components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token from POST /api/auth/login. HS256, 15-minute lifetime, revoked on logout."
  responses:
    Unauthorized:
      description: "Missing, malformed, expired, forged or revoked token (code UNAUTHENTICATED). Header `WWW-Authenticate: Bearer`."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Signed in, but the role is not permitted (FORBIDDEN) or the caller has a conflict of interest (CONFLICT_OF_INTEREST)."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: NOT_FOUND
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "INVALID_STATE, IN_PROGRESS, ITEM_UNAVAILABLE or DUPLICATE_REPORT"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: "VALIDATION_FAILED; field messages in error.details"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: "BAD_JSON (malformed JSON body)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "PAYLOAD_TOO_LARGE (body over 10 KB)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: "RATE_LIMITED or ACCOUNT_LOCKED"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: "INTERNAL. Generic message only: no stack trace or internal detail."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
            details:
              type: object
              nullable: true
              additionalProperties: true
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Ready:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
    NotReady:
      type: object
      required:
        - status
        - reason
      properties:
        status:
          type: string
          enum:
            - not_ready
        reason:
          type: string
          enum:
            - shutting_down
            - storage_unavailable
    LoginRequest:
      type: object
      required:
        - userId
        - password
      properties:
        userId:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
    LoginResponse:
      type: object
      required:
        - token
        - user
        - expiresIn
      properties:
        token:
          type: string
        user:
          type: object
          required:
            - id
            - role
          properties:
            id:
              type: string
            role:
              type: string
              enum:
                - student
                - employee
                - security
                - custodian
        expiresIn:
          type: integer
          description: Seconds
    Me:
      type: object
      required:
        - id
        - role
        - exp
      properties:
        id:
          type: string
        role:
          type: string
          enum:
            - student
            - employee
            - security
            - custodian
        exp:
          type: integer
          description: "Expiry, Unix seconds"
    ReportInput:
      type: object
      required:
        - type
        - category
        - description
        - location
        - eventDate
      properties:
        type:
          type: string
          enum:
            - lost
            - found
        category:
          type: string
          enum:
            - electronics
            - wallet
            - keys
            - bag
            - clothing
            - id-card
            - books
            - other
        description:
          type: string
          minLength: 5
          maxLength: 300
          description: "Text characters only (control characters rejected)"
        location:
          type: string
          minLength: 2
          maxLength: 100
        eventDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "A real calendar day, at most 730 days ago and not later than the next calendar day after UTC today"
        simulateDelivery:
          type: string
          enum:
            - ok
            - transient
            - permanent
          description: "Development only: simulates the notification outcome. Ignored in production."
    Report:
      type: object
      required:
        - id
        - type
        - category
        - description
        - location
        - eventDate
        - reporterId
        - status
        - createdAt
        - remindedAt
        - disposalFlagged
      properties:
        id:
          type: string
          pattern: "^R-\\d{4,}$"
        type:
          type: string
          enum:
            - lost
            - found
        category:
          type: string
          enum:
            - electronics
            - wallet
            - keys
            - bag
            - clothing
            - id-card
            - books
            - other
        description:
          type: string
        location:
          type: string
        eventDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        reporterId:
          type: string
        status:
          type: string
          enum:
            - open
            - closed
            - disposed
        createdAt:
          type: string
          format: date-time
        remindedAt:
          type: string
          format: date-time
          nullable: true
        disposalFlagged:
          type: boolean
    ReportCreated:
      type: object
      required:
        - report
        - matches
      properties:
        report:
          $ref: "#/components/schemas/Report"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
    ItemSummary:
      type: object
      nullable: true
      required:
        - id
        - category
        - description
        - location
        - eventDate
        - status
      properties:
        id:
          type: string
          pattern: "^R-\\d{4,}$"
        category:
          type: string
          enum:
            - electronics
            - wallet
            - keys
            - bag
            - clothing
            - id-card
            - books
            - other
        description:
          type: string
        location:
          type: string
        eventDate:
          type: string
        status:
          type: string
          enum:
            - open
            - closed
            - disposed
        reporterId:
          type: string
          description: "Present for staff only"
    Match:
      type: object
      required:
        - id
        - lostId
        - foundId
        - score
        - status
        - createdAt
        - verifiedBy
        - releasedTo
      properties:
        id:
          type: string
          pattern: "^M-\\d{4,}$"
        lostId:
          type: string
          pattern: "^R-\\d{4,}$"
        foundId:
          type: string
          pattern: "^R-\\d{4,}$"
        score:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum:
            - candidate
            - verified
            - released
            - rejected
            - withdrawn
        createdAt:
          type: string
          format: date-time
        verifiedBy:
          type: string
          nullable: true
        releasedTo:
          type: string
          nullable: true
        note:
          type: string
          description: "Proof checked or reason for refusing"
    StaffMatch:
      allOf:
        - $ref: "#/components/schemas/Match"
        - type: object
          required:
            - lost
            - found
          properties:
            lost:
              $ref: "#/components/schemas/ItemSummary"
            found:
              $ref: "#/components/schemas/ItemSummary"
    ClaimantMatch:
      type: object
      required:
        - id
        - lostId
        - score
        - status
        - createdAt
        - lost
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^M-\\d{4,}$"
        lostId:
          type: string
          pattern: "^R-\\d{4,}$"
        score:
          type: integer
        status:
          type: string
          enum:
            - candidate
            - verified
            - released
            - rejected
            - withdrawn
        createdAt:
          type: string
          format: date-time
        lost:
          $ref: "#/components/schemas/ItemSummary"
    VerifyRequest:
      type: object
      required:
        - ownershipConfirmed
        - note
      properties:
        ownershipConfirmed:
          type: boolean
        note:
          type: string
          minLength: 5
          maxLength: 200
          description: "The proof checked (when confirming) or the reason (when refusing)"
    Notification:
      type: object
      required:
        - id
        - matchId
        - recipientId
        - kind
        - status
        - attempts
        - lastError
      properties:
        id:
          type: string
          pattern: "^N-\\d{4,}$"
        matchId:
          type: string
          nullable: true
        recipientId:
          type: string
        kind:
          type: string
          enum:
            - candidate_match
            - aging_reminder
        status:
          type: string
          enum:
            - queued
            - sending
            - delivered
            - failed_permanent
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        refId:
          type: string
        sim:
          type: string
          description: "Staff only; development simulation field"
    ManualQueueItem:
      type: object
      required:
        - id
        - kind
        - refId
        - reason
        - status
        - createdAt
      properties:
        id:
          type: string
          pattern: "^MQ-\\d{4,}$"
        kind:
          type: string
          enum:
            - notification_failure
            - disposal_review
        refId:
          type: string
        matchId:
          type: string
          nullable: true
        reason:
          type: string
        status:
          type: string
          enum:
            - open
            - resolved
        createdAt:
          type: string
          format: date-time
        resolvedBy:
          type: string
        resolution:
          type: string
    ResolveRequest:
      type: object
      properties:
        resolution:
          type: string
          maxLength: 200
        dispose:
          type: boolean
          description: "For disposal_review items: mark the found item disposed"
    RetryResult:
      type: object
      required:
        - notification
        - queueItem
      properties:
        notification:
          $ref: "#/components/schemas/Notification"
        queueItem:
          $ref: "#/components/schemas/ManualQueueItem"
    JobRequest:
      type: object
      properties:
        now:
          type: string
          format: date-time
          description: "Testing only; refused in production"
    JobResult:
      type: object
      required:
        - reminded
        - disposalFlagged
      properties:
        reminded:
          type: array
          items:
            type: string
        disposalFlagged:
          type: array
          items:
            type: string
    AuditEntry:
      type: object
      required:
        - ts
        - actor
        - action
        - refId
      additionalProperties: true
      properties:
        ts:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        refId:
          type: string
    LogEntry:
      type: object
      required:
        - ts
        - level
        - event
      additionalProperties: true
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum:
            - info
            - warn
            - error
        event:
          type: string
    Metrics:
      type: object
      required:
        - uptimeSec
        - requests
        - routes
        - process
        - eventLoop
      properties:
        uptimeSec:
          type: integer
        requests:
          type: object
          required:
            - total
            - inFlight
            - byStatus
          properties:
            total:
              type: integer
            inFlight:
              type: integer
            byStatus:
              type: object
              additionalProperties:
                type: integer
        routes:
          type: array
          items:
            type: object
            required:
              - route
              - count
              - avgMs
              - maxMs
              - p50Ms
              - p95Ms
              - p99Ms
              - clientErrors
              - serverErrors
            properties:
              route:
                type: string
              count:
                type: integer
              avgMs:
                type: number
              maxMs:
                type: number
              p50Ms:
                type: number
              p95Ms:
                type: number
              p99Ms:
                type: number
              clientErrors:
                type: integer
              serverErrors:
                type: integer
        process:
          type: object
          required:
            - rssMB
            - heapUsedMB
            - cpuPercentSinceLast
          properties:
            rssMB:
              type: number
            heapUsedMB:
              type: number
            cpuPercentSinceLast:
              type: number
        eventLoop:
          type: object
          required:
            - meanMs
            - p99Ms
            - maxMs
          properties:
            meanMs:
              type: number
            p99Ms:
              type: number
            maxMs:
              type: number
