<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><title>Lost-and-Found state machines</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b5e8c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="620" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold"  text-anchor="middle" fill="#1b3a52">State machines</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold"  text-anchor="start" fill="#1b5e8c">Match</text>
<rect x="40" y="100" width="130" height="40" rx="20" fill="#fdf0d5" stroke="#5b7a93" stroke-width="1.5"/>
<text x="105" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">candidate</text>
<rect x="300" y="100" width="130" height="40" rx="20" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5"/>
<text x="365" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">verified</text>
<rect x="560" y="100" width="130" height="40" rx="20" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5"/>
<text x="625" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">released</text>
<rect x="300" y="220" width="130" height="40" rx="20" fill="#fbe3e1" stroke="#5b7a93" stroke-width="1.5"/>
<text x="365" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">rejected</text>
<rect x="560" y="220" width="130" height="40" rx="20" fill="#eef2f5" stroke="#5b7a93" stroke-width="1.5"/>
<text x="625" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">withdrawn</text>
<line x1="170" y1="120" x2="300" y2="120" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="235" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">verify (proof note)</text>
<line x1="430" y1="120" x2="560" y2="120" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="495" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">release</text>
<line x1="110" y1="140" x2="300" y2="235" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="40" y="215" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="start" fill="#1b5e8c">refuse (reason)</text>
<line x1="365" y1="140" x2="590" y2="222" stroke="#1b5e8c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="130" y1="140" x2="560" y2="238" stroke="#5b7a93" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="700" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">withdrawn: another claimant was released first</text>
<text x="40" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start" fill="#1b3a52">Rules: staff only; never for an item you reported lost; both reports must still be open; release only after verification.</text>
<text x="740" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold"  text-anchor="start" fill="#1b5e8c">Report</text>
<rect x="760" y="100" width="110" height="40" rx="20" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5"/>
<text x="815" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">open</text>
<rect x="990" y="100" width="110" height="40" rx="20" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5"/>
<text x="1045" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">closed</text>
<rect x="990" y="220" width="110" height="40" rx="20" fill="#eef2f5" stroke="#5b7a93" stroke-width="1.5"/>
<text x="1045" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">disposed</text>
<line x1="870" y1="120" x2="990" y2="120" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="930" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">item released</text>
<line x1="840" y1="140" x2="990" y2="236" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="770" y="205" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="start" fill="#1b5e8c">custodian disposes</text>
<text x="770" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="start" fill="#1b5e8c">(after 90 days)</text>
<text x="740" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start" fill="#1b3a52">Closed and disposed reports are never matched again.</text>
<text x="30" y="360" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold"  text-anchor="start" fill="#1b5e8c">Notification</text>
<rect x="40" y="390" width="110" height="40" rx="20" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5"/>
<text x="95" y="415" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">queued</text>
<rect x="230" y="390" width="110" height="40" rx="20" fill="#fdf0d5" stroke="#5b7a93" stroke-width="1.5"/>
<text x="285" y="415" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">sending</text>
<rect x="430" y="390" width="120" height="40" rx="20" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5"/>
<text x="490" y="415" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">delivered</text>
<rect x="430" y="480" width="150" height="40" rx="20" fill="#fbe3e1" stroke="#5b7a93" stroke-width="1.5"/>
<text x="505" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">failed_permanent</text>
<rect x="700" y="480" width="170" height="40" rx="20" fill="#fbe3e1" stroke="#5b7a93" stroke-width="1.5"/>
<text x="785" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold"  text-anchor="middle" fill="#1b3a52">manual queue item</text>
<line x1="150" y1="410" x2="230" y2="410" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<line x1="340" y1="410" x2="430" y2="410" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="385" y="402" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">ok</text>
<polyline points="285,390 285,360 340,360 340,390" fill="none" stroke="#1b5e8c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="360" y="355" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">retry (1 s, 2 s)</text>
<line x1="285" y1="430" x2="460" y2="480" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="332.5" y="477" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">3 attempts or permanent error</text>
<line x1="580" y1="500" x2="700" y2="500" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="640" y="492" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">routed</text>
<polyline points="785,480 785,440 550,440 550,410" fill="none" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="670" y="432" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">staff re-send succeeds</text>
<text x="40" y="545" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start" fill="#1b3a52">A re-send is refused (409) unless the notification has finally failed, so double-clicks cannot deliver twice.</text>
</svg>
