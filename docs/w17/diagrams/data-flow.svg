<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720"><title>Lost-and-Found main journey and data flow</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b5e8c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="620" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold"  text-anchor="middle" fill="#1b3a52">Main journey and automation (data flow)</text>
<rect x="20" y="60" width="1200" height="135" rx="4" fill="#ffffff" stroke="#5b7a93" stroke-width="1.5" />
<text x="30" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b5e8c">Student / owner</text>
<rect x="20" y="195" width="1200" height="135" rx="4" fill="#eef2f5" stroke="#5b7a93" stroke-width="1.5" />
<text x="30" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b5e8c">Security officer</text>
<rect x="20" y="330" width="1200" height="190" rx="4" fill="#ffffff" stroke="#5b7a93" stroke-width="1.5" />
<text x="30" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b5e8c">API (automatic)</text>
<rect x="20" y="520" width="1200" height="150" rx="4" fill="#eef2f5" stroke="#5b7a93" stroke-width="1.5" />
<text x="30" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b5e8c">Custodian</text>
<rect x="150" y="90" width="200" height="78" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="160" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">1  Report lost item</text>
<text x="160" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">category, description, place, date</text>
<text x="160" y="145" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">owner sees only their own data</text>
<rect x="150" y="225" width="200" height="78" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="160" y="245" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">2  Report found item</text>
<text x="160" y="265" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">same form (found); any signed-in</text>
<text x="160" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">user may report a found item</text>
<rect x="380" y="360" width="200" height="78" rx="8" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="390" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">3  Validate + de-duplicate</text>
<text x="390" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">real date, lengths, text only;</text>
<text x="390" y="415" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">same reporter, same item -&gt; 409</text>
<rect x="620" y="360" width="200" height="78" rx="8" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="630" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">4  Match + notify</text>
<text x="630" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">score &gt;= 50 and &gt;= 50% word</text>
<text x="630" y="415" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">overlap; notice to the owner,</text>
<text x="630" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">3 attempts with backoff</text>
<rect x="860" y="360" width="200" height="78" rx="8" fill="#fbe3e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="870" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">5  Failed notice?</text>
<text x="870" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">permanent failure -&gt; Manual queue</text>
<text x="870" y="415" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">(staff re-send; no double send)</text>
<rect x="890" y="90" width="200" height="78" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="900" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">6  See possible match</text>
<text x="900" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">plain-language status;</text>
<text x="900" y="145" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">only their own item shown</text>
<rect x="380" y="555" width="200" height="78" rx="8" fill="#fdf0d5" stroke="#5b7a93" stroke-width="1.5" />
<text x="390" y="575" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">7  Review the match</text>
<text x="390" y="595" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">both items side by side;</text>
<text x="390" y="610" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">cannot decide own item</text>
<rect x="620" y="555" width="200" height="78" rx="8" fill="#fdf0d5" stroke="#5b7a93" stroke-width="1.5" />
<text x="630" y="575" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">8  Verify / refuse</text>
<text x="630" y="595" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">proof or reason required (5-200</text>
<text x="630" y="610" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">characters), recorded in the audit</text>
<rect x="860" y="555" width="200" height="78" rx="8" fill="#fdf0d5" stroke="#5b7a93" stroke-width="1.5" />
<text x="870" y="575" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">9  Release (confirm)</text>
<text x="870" y="595" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">both reports close; competing</text>
<text x="870" y="610" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">matches withdrawn; audited</text>
<rect x="150" y="375" width="200" height="78" rx="8" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="160" y="395" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">10  Aging job (hourly)</text>
<text x="160" y="415" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">30 days: one reminder to staff;</text>
<text x="160" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">90 days: disposal review in the</text>
<text x="160" y="445" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">Manual queue (once each)</text>
<polyline points="350,129 362,129 362,385 380,385" fill="none" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<polyline points="350,264 372,264 372,413 380,413" fill="none" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<line x1="580" y1="399" x2="620" y2="399" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<line x1="820" y1="399" x2="860" y2="399" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<polyline points="720,360 720,300 990,300 990,168" fill="none" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="990" y="294" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">candidate notice</text>
<line x1="720" y1="438" x2="480" y2="555" stroke="#5b7a93" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="580" y1="594" x2="620" y2="594" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<line x1="820" y1="594" x2="860" y2="594" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<polyline points="1060,594 1195,594 1195,150 1090,150" fill="none" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="1188" y="420" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="end" fill="#1b5e8c">released / closed</text>
<text x="620" y="712" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" text-anchor="middle" fill="#1b3a52">Every state change writes an audit entry; every 2xx response is sent only after the data is on disk.</text>
</svg>
