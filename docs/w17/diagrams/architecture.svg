<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="825" viewBox="0 0 1240 825"><title>Lost-and-Found architecture and trust boundaries</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b5e8c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="620" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold"  text-anchor="middle" fill="#1b3a52">Campus Lost-and-Found: final architecture (single-instance pilot)</text>
<rect x="20" y="50" width="300" height="700" rx="8" fill="#eef2f5" stroke="#9b6b2f" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#7a4d12">Browsers (untrusted)</text>
<text x="32" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" text-anchor="start" fill="#7a4d12">TB1: network and client</text>
<rect x="40" y="110" width="260" height="90" rx="8" fill="#ffffff" stroke="#5b7a93" stroke-width="1.5" />
<text x="50" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Student / employee</text>
<text x="50" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">Report lost or found items</text>
<text x="50" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">See own matches and notices</text>
<rect x="40" y="215" width="260" height="90" rx="8" fill="#ffffff" stroke="#5b7a93" stroke-width="1.5" />
<text x="50" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Security officer</text>
<text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">Report found items</text>
<text x="50" y="271" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">Verify or refuse claims</text>
<rect x="40" y="320" width="260" height="90" rx="8" fill="#ffffff" stroke="#5b7a93" stroke-width="1.5" />
<text x="50" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Custodian</text>
<text x="50" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">Verify, release, dispose</text>
<text x="50" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">Re-send failed notices</text>
<rect x="40" y="440" width="260" height="130" rx="8" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="50" y="460" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Flutter Web app</text>
<text x="50" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">Runs in the browser; token kept</text>
<text x="50" y="496" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">in memory only (never stored)</text>
<text x="50" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">Client checks are convenience:</text>
<text x="50" y="528" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">the server validates everything</text>
<rect x="40" y="595" width="260" height="130" rx="8" fill="#fdf0d5" stroke="#5b7a93" stroke-width="1.5" />
<text x="50" y="615" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Static host / CDN</text>
<text x="50" y="635" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">Serves the app files</text>
<text x="50" y="651" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">gzip/brotli, ETag revalidation</text>
<text x="50" y="667" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">(no stale app code after deploy)</text>
<text x="50" y="683" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal"  text-anchor="start" fill="#1b3a52">security headers, SPA fallback</text>
<line x1="170" y1="570" x2="170" y2="595" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="222" y="576.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">downloads app</text>
<rect x="380" y="50" width="520" height="700" rx="8" fill="#f6fafd" stroke="#1b5e8c" stroke-width="1.5" />
<text x="390" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">API server: Node.js + Express (one process)</text>
<text x="392" y="90" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start" fill="#1b3a52">Every request passes the same pipeline, in this order:</text>
<rect x="400" y="104" width="480" height="44" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">1  Metrics + slow-request log</text>
<text x="412" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">counts, latency, event-loop delay</text>
<rect x="400" y="154" width="480" height="44" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="174" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">2  Security headers (helmet) + CORS allow-list</text>
<text x="412" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">HSTS, nosniff, CSP; only configured origins</text>
<rect x="400" y="204" width="480" height="44" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">3  Rate limits</text>
<text x="412" y="240" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">global per IP (proxy-aware), login per IP, lockout per account</text>
<rect x="400" y="254" width="480" height="44" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">4  JSON parser</text>
<text x="412" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">10 KB limit, malformed JSON -&gt; 400</text>
<rect x="400" y="304" width="480" height="44" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">5  Authentication</text>
<text x="412" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">signed token (HS256), expiry, revocation; role from token only</text>
<rect x="400" y="354" width="480" height="44" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">6  Durability gate</text>
<text x="412" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">a 2xx is sent only after the change is on disk</text>
<rect x="400" y="404" width="480" height="44" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold"  text-anchor="start" fill="#1b3a52">7  Routes + role checks + ownership checks</text>
<text x="412" y="440" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">401 / 403 / 404; staff-only operations</text>
<rect x="400" y="462" width="230" height="128" rx="8" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Workflow</text>
<text x="410" y="502" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">Strict validation (type, length,</text>
<text x="410" y="517" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">real dates), duplicate control,</text>
<text x="410" y="532" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">state machine, separation of</text>
<text x="410" y="547" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">duties, audit trail</text>
<rect x="650" y="462" width="230" height="128" rx="8" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="660" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Matching (cached tokens)</text>
<text x="660" y="502" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">Category + description overlap</text>
<text x="660" y="517" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">+ location + date -&gt; score;</text>
<text x="660" y="532" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">candidate needs score &gt;= 50 and</text>
<text x="660" y="547" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">&gt;= 50% word overlap</text>
<rect x="400" y="605" width="230" height="125" rx="8" fill="#fdf0d5" stroke="#5b7a93" stroke-width="1.5" />
<text x="410" y="625" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Store (group commit)</text>
<text x="410" y="645" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">Concurrent writes share one</text>
<text x="410" y="660" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">async atomic file write; .bak</text>
<text x="410" y="675" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">rotated; recovers from crash</text>
<text x="410" y="690" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">or corruption automatically</text>
<rect x="650" y="605" width="230" height="125" rx="8" fill="#dff2e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="660" y="625" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Notifier</text>
<text x="660" y="645" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">3 attempts, 1 s then 2 s backoff,</text>
<text x="660" y="660" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">then the manual queue; staff can</text>
<text x="660" y="675" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">re-send (guarded against</text>
<text x="660" y="690" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">double delivery)</text>
<rect x="960" y="50" width="260" height="320" rx="8" fill="#eef2f5" stroke="#9b6b2f" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="970" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#7a4d12">Outside the API process</text>
<text x="972" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" text-anchor="start" fill="#7a4d12">TB2 and TB3</text>
<rect x="975" y="105" width="230" height="100" rx="8" fill="#fdf0d5" stroke="#5b7a93" stroke-width="1.5" />
<text x="985" y="125" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Data file: db.json (+ .bak)</text>
<text x="985" y="145" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">Single writer; JSON; ~0.4 KB per</text>
<text x="985" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">report. Replace with a database</text>
<text x="985" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">before ~10,000 stored reports</text>
<rect x="975" y="225" width="230" height="125" rx="8" fill="#fbe3e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="985" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Notification channel</text>
<text x="985" y="265" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">Simulated in the pilot. A real</text>
<text x="985" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">e-mail/SMS gateway must move</text>
<text x="985" y="295" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">out of the request (queue) so</text>
<text x="985" y="310" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">a slow gateway cannot slow users</text>
<rect x="960" y="390" width="260" height="190" rx="8" fill="#dcebf7" stroke="#5b7a93" stroke-width="1.5" />
<text x="970" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Operations (read-only probes)</text>
<text x="970" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">GET /health   liveness</text>
<text x="970" y="445" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">GET /ready    readiness (503 when</text>
<text x="970" y="460" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">              storage fails / draining)</text>
<text x="970" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">GET /api/metrics (staff only)</text>
<text x="970" y="490" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">GET /api/openapi.json  API contract</text>
<text x="970" y="505" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">Graceful shutdown (SIGTERM)</text>
<text x="970" y="520" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">Health-gated deploy + rollback</text>
<rect x="960" y="600" width="260" height="130" rx="8" fill="#fbe3e1" stroke="#5b7a93" stroke-width="1.5" />
<text x="970" y="620" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold"  text-anchor="start" fill="#1b3a52">Alerts to set (see runbook)</text>
<text x="970" y="640" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">event-loop delay p99 &gt; 100 ms</text>
<text x="970" y="655" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">CPU &gt; 100% for 5 min</text>
<text x="970" y="670" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">/ready not 200, 5xx rate &gt; 1%</text>
<text x="970" y="685" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal"  text-anchor="start" fill="#1b3a52">data file &gt; 8 MB</text>
<polyline points="300,505 350,505 350,126 400,126" fill="none" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="348" y="236" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">HTTPS (TLS 1.2+)</text>
<line x1="170" y1="570" x2="170" y2="595" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<text x="222" y="576.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#1b5e8c">downloads app</text>
<line x1="630" y1="526" x2="650" y2="526" stroke="#1b5e8c" stroke-width="2"  marker-end="url(#arr)"/>
<line x1="515" y1="590" x2="515" y2="605" stroke="#5b7a93" stroke-width="2"  marker-end="url(#arr)"/>
<line x1="765" y1="590" x2="765" y2="605" stroke="#5b7a93" stroke-width="2"  marker-end="url(#arr)"/>
<polyline points="515,730 515,765 938,765 938,155 975,155" fill="none" stroke="#8a5a12" stroke-width="2"  marker-end="url(#arr)"/>
<text x="938" y="759" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#8a5a12">persist</text>
<polyline points="880,668 915,668 915,290 975,290" fill="none" stroke="#a33a2f" stroke-width="2"  marker-end="url(#arr)"/>
<text x="893" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"  text-anchor="middle" fill="#a33a2f">notify</text>
<line x1="960" y1="470" x2="900" y2="470" stroke="#5b7a93" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="620" y="805" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" text-anchor="middle" fill="#1b3a52">TB1: client to API (TLS, auth, validation, rate limits)   TB2: API to data file (atomic writes, single writer)   TB3: API to notification channel (ids only, bounded retries)</text>
</svg>
