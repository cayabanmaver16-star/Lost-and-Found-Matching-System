<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the --base-href value given to `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Campus Lost &amp; Found: report lost items, see possible matches and track their release.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lost &amp; Found">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Campus Lost &amp; Found</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen: the first visit downloads about 3.6 MB (compressed), so show progress instead of a blank page. */
    html, body { margin: 0; height: 100%; background: #f7f9fc; font-family: Roboto, Arial, sans-serif; color: #1b3a52; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; }
    #splash .spinner { width: 44px; height: 44px; border: 4px solid #cfe0ee; border-top-color: #1b5e8c; border-radius: 50%; animation: spin 0.9s linear infinite; }
    #splash h1 { font-size: 1.25rem; font-weight: 500; margin: 0; }
    #splash p { margin: 0; font-size: 0.9rem; color: #4d6a80; max-width: 28rem; }
    #splash .slow { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Campus Lost &amp; Found</h1>
    <p>Loading the app&hellip;</p>
    <p class="slow">This is taking longer than usual (the first visit downloads a few megabytes). It will be faster next time.</p>
    <noscript><p>This app needs JavaScript. Please enable it and reload.</p></noscript>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var slow = setTimeout(function () { var s = splash && splash.querySelector('.slow'); if (s) s.style.display = 'block'; }, 6000);
      window.addEventListener('flutter-first-frame', function () { clearTimeout(slow); if (splash) splash.remove(); });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
